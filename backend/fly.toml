# Fly.io configuration
app = "polymarket-whale-monitor"
primary_region = "ord"  # Chicago - low latency to Polymarket

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false  # Keep running for monitoring
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "polymarket_data"
  destination = "/app/data"
